<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator AFM Stocare - Cosmo Group / Premium Serv Instal</title>
    <style>
        :root {
            --primary-color: #004b87;
            --secondary-color: #00a651;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            padding: 25px 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .logo-img {
            max-width: 100px;
            height: auto;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 20px;
            margin: 0 0 5px 0;
        }

        .header p {
            color: #666;
            font-size: 13px;
            margin: 0;
        }
        
        .section-title {
            font-size: 16px;
            color: var(--primary-color);
            margin-top: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--secondary-color);
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
            color: #444;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
        }

        .note-info {
            font-size: 11px;
            color: #d9534f;
            margin-top: 4px;
            line-height: 1.4;
        }

        .gdpr-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
            font-size: 12px;
            color: #555;
            line-height: 1.4;
        }

        .gdpr-group input {
            margin-top: 2px;
            transform: scale(1.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn:hover {
            background-color: #003666;
        }

        .results {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .result-item.afm {
            font-weight: bold;
            color: var(--secondary-color);
        }

        .result-item.client {
            font-weight: 900;
            font-size: 18px;
            color: var(--primary-color);
            padding: 10px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .btn-whatsapp {
            background-color: #25D366;
            margin-top: 20px;
            display: block;
            text-decoration: none;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
        }
        
        .error-msg {
            color: #d9534f;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <div class="header">
            <!-- Sigla Cosmo Group adăugată aici -->
            <img src="https://raw.githubusercontent.com/crisandaniel1/calculator-afm/main/logo.jpg" alt="Cosmo Group Logo" class="logo-img" onerror="this.style.display='none'">
            <h1>PREMIUM SERV INSTAL</h1>
            <p>Formular & Calculator AFM Stocare</p>
        </div>

        <!-- Date de Contact -->
        <div class="section-title">Date de Contact</div>
        <div class="form-group">
            <label>Nume și Prenume *</label>
            <input type="text" id="numeClient" class="form-control" placeholder="Ion Popescu">
        </div>
        <div class="form-group">
            <label>Număr de Telefon *</label>
            <input type="tel" id="telefonClient" class="form-control" placeholder="0712345678">
        </div>

        <!-- 1. Sistemul Existent -->
        <div class="section-title">1. Date Tehnice Sistem</div>
        
        <div class="form-group">
            <label>Marca invertorului</label>
            <select id="invertor" class="form-control">
                <option value="Huawei">Huawei</option>
                <option value="Sungrow">Sungrow</option>
                <option value="Deye">Deye</option>
                <option value="Altul">Altul / Nu știu</option>
            </select>
        </div>

        <div class="form-group">
            <label>Tip branșament</label>
            <select id="bransament" class="form-control">
                <option value="Monofazat (220V)">Monofazat (220V)</option>
                <option value="Trifazat (380V)">Trifazat (380V)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Putere invertor</label>
            <select id="putereInvertor" class="form-control" onchange="verificaAltulInv()">
                <option value="3 kW">3 kW</option>
                <option value="5 kW">5 kW</option>
                <option value="10 kW">10 kW</option>
                <option value="Altul">Altă putere</option>
            </select>
            <input type="text" id="putereManual" class="form-control" placeholder="Specifică puterea (ex: 8 kW)" style="display:none; margin-top:10px;">
        </div>

        <div class="form-group">
            <label>Invertorul este HIBRID?</label>
            <select id="hibrid" class="form-control">
                <option value="Da">Da</option>
                <option value="Nu">Nu</option>
                <option value="Nu știu">Nu știu</option>
            </select>
        </div>

        <div class="form-group">
            <label>Putere panouri instalate (kWp)</label>
            <input type="text" id="puterePanouri" class="form-control" placeholder="Ex: 5">
        </div>

        <!-- 2. Locația -->
        <div class="section-title">2. Locație</div>
        <div class="form-group">
            <label>Județul</label>
            <select id="judet" class="form-control">
                <option value="Arad">Arad</option>
                <option value="Timiș">Timiș</option>
                <option value="Bihor">Bihor</option>
                <option value="Altul">Alt județ</option>
            </select>
        </div>

        <!-- 3. Nevoia de Stocare -->
        <div class="section-title">3. Baterii (Stocare)</div>
        <div class="form-group">

            <select id="capacitateSelect" class="
