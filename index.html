<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator & Formular - Cosmo Group</title>
    <style>
        :root {
            --primary-color: #0b2545;
            --secondary-color: #134074;
            --accent-color: #8da9c4;
            --light-bg: #eeeff2;
            --white: #ffffff;
            --text-color: #1d2d44;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--light-bg);
            padding-bottom: 20px;
        }
        .logo-area {
            font-size: 26px;
            font-weight: bold;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .logo-area span {
            color: var(--secondary-color);
        }
        h2 {
            color: var(--primary-color);
            margin-top: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--secondary-color);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(19, 64, 116, 0.15);
        }
        .btn {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: var(--secondary-color);
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8fafc;
            border-left: 5px solid var(--primary-color);
            border-radius: 0 6px 6px 0;
            display: none;
        }
        .result-box h3 {
            margin-top: 0;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-area">Cosmo <span>Group</span></div>
        <h2>Calculator & Formular Tehnic</h2>
    </div>

    <form id="calcForm">
        <div class="form-group">
            <label for="numeClient">Nume și Prenume / Beneficiar:</label>
            <input type="text" id="numeClient" placeholder="Introduceți numele complet" required>
        </div>

        <div class="form-group">
            <label for="capacitateSistem">Capacitate Sistem / Putere Instalată (kW):</label>
            <input type="number" id="capacitateSistem" step="0.1" placeholder="Ex: 5.5" required>
        </div>

        <div class="form-group">
            <label for="tipEchipament">Tip Invertor / Echipament Principal:</label>
            <select id="tipEchipament">
                <option value="Huawei">Huawei (Tricofazat / Monofazat)</option>
                <option value="Loxone">Loxone Smart Integration</option>
                <option value="Standard">Standard / Altele</option>
            </select>
        </div>

        <div class="form-group">
            <label for="observatii">Observații / Detalii amplasament:</label>
            <textarea id="observatii" rows="3" placeholder="Mențiuni legate de montaj, acoperiș sau locație"></textarea>
        </div>

        <button type="button" class="btn" onclick="calculeazaDatele()">Calculează și Generează Fișa</button>
    </form>

    <div id="rezultat" class="result-box">
        <h3>Centralizator Date:</h3>
        <p id="outputRezultat"></p>
    </div>
</div>

<script>
    function calculeazaDatele() {
        const nume = document.getElementById('numeClient').value;
        const putere = document.getElementById('capacitateSistem').value;
        const echipament = document.getElementById('tipEchipament').value;
        const observatii = document.getElementById('observatii').value;

        if (!nume || !putere) {
            alert('Te rog să completezi cel puțin numele și capacitatea sistemului!');
            return;
        }

        // Estimare orientativă sau procesare date
        const estimarePanouri = Math.round(putere * 2.5); // ex: ~2.5 panouri per kW

        let htmlRezultat = `<strong>Beneficiar:</strong> ${nume}<br>`;
        htmlRezultat += `<strong>Putere instalată:</strong> ${putere} kW (Aprox. ${estimarePanouri} panouri fotovoltaice)<br>`;
        htmlRezultat += `<strong>Echipament selectat:</strong> ${echipament}<br>`;
        if(observatii) {
            htmlRezultat += `<strong>Observații:</strong> ${observatii}<br>`;
        }
        htmlRezultat += `<br><span style="color: #134074; font-weight: bold;">✔ Datele au fost procesate cu succes sub sigla Cosmo Group.</span>`;

        document.getElementById('outputRezultat').innerHTML = htmlRezultat;
        document.getElementById('rezultat').style.display = 'block';
    }
</script>

</body>
</html>
