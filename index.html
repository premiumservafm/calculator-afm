<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator AFM Stocare - Premium Serv Instal</title>
    <style>
        :root {
            --primary-color: #004b87;
            --secondary-color: #00a651;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-img {
            max-width: 90px;
            height: auto;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 20px;
            margin: 0 0 5px 0;
        }

        .header p {
            color: #666;
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #003666;
        }

        .results {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .result-item.total {
            font-weight: bold;
            color: #555;
        }

        .result-item.afm {
            font-weight: bold;
            color: var(--secondary-color);
        }

        .result-item.client {
            font-weight: 900;
            font-size: 18px;
            color: var(--primary-color);
            padding: 10px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .btn-whatsapp {
            background-color: #25D366;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        .btn-whatsapp:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <div class="header">
            <!-- Sigla Cosmo Group -->
            <img src="https://raw.githubusercontent.com/crisandaniel1/calculator-afm/main/logo.jpg" alt="Cosmo Group" class="logo-img" onerror="this.style.display='none'">
            <h1>PREMIUM SERV INSTAL</h1>
            <p>Calculator Eligibilitate AFM Stocare 2026</p>
        </div>

        <div class="form-group">
            <label for="invertor">Ce model de invertor hibrid ai?</label>
            <select id="invertor" class="form-control">
                <option value="Huawei">Huawei</option>
                <option value="Fronius">Fronius</option>
                <option value="Sungrow">Sungrow</option>
                <option value="Deye">Deye</option>
                <option value="Altul">Altul / Nu știu</option>
            </select>
        </div>

        <div class="form-group">
            <label for="capacitate">Capacitate stocare dorită (kWh)</label>
            <input type="number" id="capacitate" class="form-control" value="10" min="10" max="30">
        </div>

        <button class="btn" onclick="calculeaza()">Calculează Costurile</button>

        <div id="results-container" class="results">
            <div class="result-item total">
                <span>Cost total estimat (standard AFM):</span>
                <span id="rez-total">0 Lei</span>
            </div>
            <div class="result-item afm">
                <span>Subvenție AFM (Max 15.000 Lei):</span>
                <span id="rez-afm">0 Lei</span>
            </div>
            <div class="result-item client">
                <span>Contribuția Ta:</span>
                <span id="rez-client">0 Lei</span>
            </div>
            
            <p style="font-size: 11px; color: #888; text-align: center; margin-top: 15px;">
                *Valorile sunt strict estimative, conform standardului de cost de 1.500 lei/kWh.
            </p>

            <a href="#" id="btn-wa" class="btn btn-whatsapp" target="_blank">
                Trimite-ne solicitarea pe WhatsApp 📲
            </a>
        </div>
    </div>

    <script>
        function calculeaza() {
            var capacitate = parseFloat(document.getElementById('capacitate').value);
            var invertor = document.getElementById('invertor').value;

            if (isNaN(capacitate) || capacitate < 10) {
                alert("Programul AFM impune un minim de 10 kWh.");
                return;
            }

            var pretTotal = capacitate * 1500;
            var subventieAfm = Math.min(15000, pretTotal * 0.75);
            var contributieClient = pretTotal - subventieAfm;

            document.getElementById('rez-total').innerText = formataSuma(pretTotal);
            document.getElementById('rez-afm').innerText = formataSuma(subventieAfm);
            document.getElementById('rez-client').innerText = formataSuma(contributieClient);

            var telefon = "40747193002";
            var mesaj = "Salutare! Am folosit calculatorul Premium Serv Instal.%0A%0A*Invertor:* " + encodeURIComponent(invertor) + "%0A*Capacitate baterie:* " + capacitate + " kWh%0A%0AMă interesează instalarea. Putem discuta detaliile?";
            var waUrl = "https://wa.me/" + telefon + "?text=" + mesaj;
            document.getElementById('btn-wa').href = waUrl;

            document.getElementById('results-container').style.display = 'block';
        }

        function formataSuma(numar) {
            return new Intl.NumberFormat('ro-RO').format(numar) + ' Lei';
        }
    </script>
</body>
</html>
